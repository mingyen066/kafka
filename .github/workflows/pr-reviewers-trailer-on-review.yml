# Credits a reviewer in the PR's `Reviewers:` trailer when they submit a
# review (including a bare Approve).
#
# We cannot react to the `pull_request_review` event directly: on first-time
# contributors' fork PRs that event is gated behind `action_required`, and
# the gated run cannot even be approved because its head points at the base
# repo (the fork-PR approve API rejects it with HTTP 403). So we react to the
# `workflow_run` of "Pull Request Reviewed" instead. That listener runs in the
# trusted base-repo context, is never gated, and exposes the reviewer as
# workflow_run.actor.login. The PR number is recovered by matching the run's
# head_sha against open PRs.

name: Reviewers Trailer (on review)

on:
  workflow_run:
    workflows: [Pull Request Reviewed]
    types:
      - requested

run-name: Reviewers Trailer for ${{ github.event.workflow_run.display_title }}

jobs:
  append-trailer:
    # Only react to review submissions. The "Pull Request Reviewed" workflow
    # also runs on `pull_request` (open / edit), where the actor is the PR
    # author rather than a reviewer.
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Env
        run: printenv
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Append reviewer trailer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REVIEWER_LOGIN: ${{ github.event.workflow_run.actor.login }}
        run: |
          set -e
          PR_NUMBER=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq "map(select(.head.sha==\"$HEAD_SHA\")) | .[0].number")
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR found for head sha $HEAD_SHA; nothing to do."
            exit 0
          fi
          echo "Crediting reviewer '$REVIEWER_LOGIN' on PR #$PR_NUMBER."
          PR_NUMBER="$PR_NUMBER" REVIEWER_LOGIN="$REVIEWER_LOGIN" \
            python .github/scripts/pr-reviewers-trailer.py
